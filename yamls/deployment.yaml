apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-api
  labels:
    app: inventario-api
spec:
  selector:
    matchLabels:
      app: inventario-api
  template:
    metadata:
      labels:
        app: inventario-api
    spec:
      containers:
        - name: inventario-api
          image: fjmurort/inventario-cloud-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: configuracion-inventario
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
